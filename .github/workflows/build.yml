name: Build DRAGON-AC
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python asset converter
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build Release
        run: cmake --build build --config Release --parallel
      - name: Package single executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/DRAGON-AC.exe dist/DRAGON-AC.exe
          Compress-Archive -Path dist/DRAGON-AC.exe -DestinationPath DRAGON-AC-Windows-x64.zip -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DRAGON-AC-Windows-x64
          path: dist/DRAGON-AC.exe
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DRAGON-AC-Windows-x64.zip
          generate_release_notes: true
